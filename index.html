<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SmartInsole Webapp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h2>SmartInsole – BLE + Heatmap + 3D</h2>

<!-- ── Connessione ── -->
<div class="row-wrap">
  <button id="btnRight">Connetti Right</button>
  <span id="stRight" class="status">Right: non connesso</span>
  <button id="btnLeft" style="margin-left:16px">Connetti Left</button>
  <span id="stLeft" class="status">Left: non connesso</span>
</div>

<!-- ── Controlli acquisizione ── -->
<div class="row-wrap" style="margin-top:10px">
  <button id="btnStart">Start</button>
  <button id="btnStop" disabled>Stop</button>
  <button id="btnDisconnect">Disconnect</button>
</div>

<!-- ── Utility ── -->
<div class="row-wrap" style="margin-top:10px">
  <label><input type="checkbox" id="chkKg"> Mostra kg</label>
  <button id="btnZeroIMU">Zero IMU</button>
  <button id="btnReset">Reset</button>
</div>

<!-- ── Session Recorder ── -->
<h3>Session Recorder</h3>
<div class="row-wrap">
  <input id="patientId" placeholder="Patient ID (opz.)" />
  <button id="btnRecStart">REC Start</button>
  <button id="btnRecStop" disabled>REC Stop</button>
  <button id="btnRecDownload" disabled>Download CSV</button>
  <span id="recStatus" class="status"></span>
</div>

<!-- ── Visualizzazione principale ── -->
<h3>Heatmap pressioni plantari</h3>
<div class="viz-row">

  <!-- LEFT foot column -->
  <div class="foot-col">
    <div class="foot-title">LEFT</div>
    <canvas id="cvHeatL" width="200" height="498" class="heatmap-cv"></canvas>
  </div>

  <!-- RIGHT foot column -->
  <div class="foot-col">
    <div class="foot-title">RIGHT</div>
    <canvas id="cvHeatR" width="200" height="498" class="heatmap-cv"></canvas>
  </div>

  <!-- Colorbar -->
  <div class="cbar-col">
    <span class="cbar-label" id="cbarMax">— N</span>
    <canvas id="cbar" width="22" height="440" class="cbar-cv"></canvas>
    <span class="cbar-label">0 N</span>
  </div>

</div>

<!-- ── 3D Foot models ── -->
<h3>Modello 3D – orientamento IMU</h3>
<div class="viz-row">
  <div class="foot-col">
    <div class="foot-title">LEFT 3D</div>
    <div id="foot3dL" class="foot3d"></div>
  </div>
  <div class="foot-col">
    <div class="foot-title">RIGHT 3D</div>
    <div id="foot3dR" class="foot3d"></div>
  </div>
</div>

<!-- ── Dati testuali ── -->
<h3>Dati</h3>
<pre id="out">—</pre>

<!-- ── Log ── -->
<h3>Log</h3>
<pre id="log">—</pre>

<div id="jsOk" style="margin-top:8px;font-weight:600"></div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js?v=4"></script>

<!-- Colorbar init (after app.js defines heatColor) -->
<script>
(function initCbar(){
  const cv = document.getElementById("cbar");
  if (!cv || typeof heatColor === "undefined") { setTimeout(initCbar, 300); return; }
  const ctx = cv.getContext("2d");
  const h = cv.height;
  for (let y=0;y<h;y++){
    const [r,g,b] = heatColor(1-y/h);
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(0,y,cv.width,1);
  }
})();
</script>

</body>
</html>
