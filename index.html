<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SmartInsole Webapp</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h2>SmartInsole – Webapp (BLE + CoP + CSV)</h2>

  <p>
    Connettiti alle solette <b>Right</b> e/o <b>Left</b> via Bluetooth (Chrome / Android).
  </p>

  <!-- Connessione -->
  <div style="display:flex; gap:12px; align-items:center;">
    <button id="btnRight">Connetti Right</button>
    <span id="stRight">Right: non connesso</span>
  </div>

  <div style="display:flex; gap:12px; align-items:center; margin-top:8px;">
    <button id="btnLeft">Connetti Left</button>
    <span id="stLeft">Left: non connesso</span>
  </div>

  <!-- Controlli -->
  <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
    <button id="btnStart">Start</button>
    <button id="btnStop" disabled>Stop</button>
    <button id="btnDisconnect">Disconnect</button>
  </div>

  <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
    <label><input type="checkbox" id="chkKg"> Mostra kg</label>
    <button id="btnZeroIMU">Zero IMU</button>
    <button id="btnReset">Reset</button>
  </div>

  <!-- Recorder -->
  <h3>Session Recorder</h3>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <input id="patientId" placeholder="Patient ID (opz.)" />
    <button id="btnRecStart">REC Start</button>
    <button id="btnRecStop" disabled>REC Stop</button>
    <button id="btnRecDownload" disabled>Download CSV</button>
    <span id="recStatus"></span>
  </div>

  <!-- Output testuale -->
  <h3>Dati</h3>
  <pre id="out">—</pre>

  <!-- CoP -->
  <h3>Center of Pressure (2D)</h3>
  <div style="display:flex; gap:16px; flex-wrap:wrap;">
    <div>
      <div><b>Right</b></div>
      <canvas id="cvRight" width="260" height="520"
        style="border:1px solid #333; border-radius:10px;"></canvas>
    </div>
    <div>
      <div><b>Left</b></div>
      <canvas id="cvLeft" width="260" height="520"
        style="border:1px solid #333; border-radius:10px;"></canvas>
    </div>
  </div>

  <!-- Log -->
  <h3>Log</h3>
  <pre id="log">—</pre>

  <div id="jsOk" style="margin-top:8px; font-weight:600;"></div>

  <script src="app.js?v=1"></script>
</body>
</html>
