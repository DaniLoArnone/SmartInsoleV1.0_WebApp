<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FSR Webapp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>SmartInsole – Webapp (Step 2: BLE)</h2>
  <p>Connettiti a <b>Right</b> e/o <b>Left</b> via Bluetooth (Chrome).</p>

  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
    <button id="btnRight">Connetti Right</button>
    <span id="stRight">Right: non connesso</span>
  </div>

  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:10px;">
    <button id="btnLeft">Connetti Left</button>
    <span id="stLeft">Left: non connesso</span>
  </div>

  <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
    <button id="btnStart">Start</button>
    <button id="btnStop" disabled>Stop</button>
    <button id="btnDisconnect">Disconnect</button>
  </div>

  <div style="margin-top:12px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
    <label style="display:flex; gap:8px; align-items:center;">
      <input id="chkKg" type="checkbox" />
      Mostra in kg (default: N)
    </label>
    <button id="btnZeroIMU">Zero IMU</button>
    <button id="btnReset">Reset (clear)</button>
  </div>

  <!-- Recorder -->
  <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <input id="patientId" type="text" placeholder="ID paziente / sessione (opz.)" style="min-width:260px;" />
    <button id="btnRecStart">Start Rec</button>
    <button id="btnRecStop" disabled>Stop Rec</button>
    <button id="btnRecDownload" disabled>Download CSV</button>
    <span id="recStatus" style="font-weight:600;"></span>
  </div>

  <div id="jsOk" style="margin-top:10px; font-weight:600;"></div>

  <h3>Dati</h3>
  <pre id="out">—</pre>

  <h3>Log</h3>
  <pre id="log">—</pre>

  <script src="app.js?v=20"></script>
</body>
</html>
